<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Що готуємо?</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🍽️ Що готуємо?</h1>

  <div class="top-buttons">
    <button onclick="showAddForm()">➕ Запропонувати</button>
    <button onclick="showFavorites()">❤️ Улюблені</button>
  </div>

  <div id="recipes" class="recipes"></div>

  <!-- ФОРМА ДОДАВАННЯ -->
  <div id="addForm" class="form hidden">

    <h2>➕ Новий рецепт</h2>

    <input id="newName" placeholder="Назва страви">

    <input id="newImage" placeholder="Посилання на фото">

    <input id="newTikTok" placeholder="Посилання на TikTok">

    <textarea
      id="newIngredients"
      placeholder="Інгредієнти через кому:
картопля, курка, сир..."
    ></textarea>

    <div class="form-buttons">
      <button onclick="addRecipe()">Додати</button>
      <button onclick="hideAddForm()">Скасувати</button>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
