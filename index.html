<!DOCTYPE html>
<html lang="uk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Що готуємо?</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<div class="container">

  <h1>🍽️ Що готуємо?</h1>


  <div class="top-buttons">

    <button
      class="add-button"
      onclick="showAddForm()"
    >
      ➕ Запропонувати рецепт
    </button>

  </div>


  <!-- ========================================= -->
  <!-- РЕЦЕПТИ -->
  <!-- ========================================= -->

  <div
    id="recipes"
    class="recipes"
  ></div>


  <!-- ========================================= -->
  <!-- ФОРМА -->
  <!-- ========================================= -->

  <div
    id="addForm"
    class="form hidden"
  >

    <h2>➕ Запропонувати рецепт</h2>


    <input
      id="newName"
      type="text"
      placeholder="Назва страви"
    >


    <input
      id="newTikTok"
      type="url"
      placeholder="Посилання на TikTok"
    >


    <textarea
      id="newIngredients"
      placeholder="Інгредієнти:

картопля
курка
сир
сметана
спеції"
    ></textarea>


    <div class="form-buttons">

      <button
        class="save-button"
        onclick="addRecipe()"
      >
        Додати ❤️
      </button>


      <button
        class="cancel-button"
        onclick="hideAddForm()"
      >
        Скасувати
      </button>

    </div>

  </div>

</div>


<!-- Спочатку наш JS -->
<script src="script.js"></script>


<!-- Потім TikTok -->
<script
  async
  src="https://www.tiktok.com/embed.js"
  onload="renderTikTokEmbeds()"
></script>


</body>

</html>
